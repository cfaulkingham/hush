name: test
on:
  push:
  pull_request:
jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test ./...
      - if: runner.os == 'Windows'
        run: go build ./...
      - if: runner.os != 'Windows'
        run: go test -race ./...
