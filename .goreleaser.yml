version: 2

project_name: hush

builds:
  - main: ./cmd/hush
    binary: hush
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/cfaulkingham/hush/internal/cli.version={{.Version}}
      - -X github.com/cfaulkingham/hush/internal/cli.commit={{.Commit}}
      - -X github.com/cfaulkingham/hush/internal/cli.date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
